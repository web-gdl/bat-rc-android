name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.BATRC_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BATRC_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Firmando con la clave privada del repositorio."
          else
            echo "Sin secreto BATRC_KEYSTORE_BASE64: se firma con keystore/debug.keystore."
          fi

      - name: Tests y compilación
        env:
          BATRC_KEYSTORE_PASSWORD: ${{ secrets.BATRC_KEYSTORE_PASSWORD }}
          BATRC_KEY_ALIAS: ${{ secrets.BATRC_KEY_ALIAS }}
          BATRC_KEY_PASSWORD: ${{ secrets.BATRC_KEY_PASSWORD }}
        run: ./gradlew --stacktrace testDebugUnitTest assembleRelease

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk BatRC-Control.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BatRC-Control-apk
          path: BatRC-Control.apk

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" BatRC-Control.apk \
            --title "BatRC Control $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md
