name: Android

on:
  push:
    branches: ["**", "!capturas"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.BATRC_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BATRC_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Firmando con la clave privada del repositorio."
          else
            echo "Sin secreto BATRC_KEYSTORE_BASE64: se firma con keystore/debug.keystore."
          fi

      - name: Tests y compilación
        env:
          BATRC_KEYSTORE_PASSWORD: ${{ secrets.BATRC_KEYSTORE_PASSWORD }}
          BATRC_KEY_ALIAS: ${{ secrets.BATRC_KEY_ALIAS }}
          BATRC_KEY_PASSWORD: ${{ secrets.BATRC_KEY_PASSWORD }}
        run: ./gradlew --stacktrace testDebugUnitTest assembleRelease

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk BatRC-Control.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BatRC-Control-apk
          path: BatRC-Control.apk

      - name: Publicar Release
        # Cada versionName nuevo en app/build.gradle.kts crea una Release vX.Y.Z.
        # Si ya existe, se sustituye el APK por el recién compilado.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BatRC-Control.apk --clobber
          else
            gh release create "$TAG" BatRC-Control.apk \
              --target "$GITHUB_SHA" \
              --title "BatRC Control $TAG" \
              --notes-file docs/RELEASE_NOTES.md \
              --latest
          fi

  capturas:
    # Capturas reales de la app en un emulador Android 14 (sin vehículo).
    # Se guardan en la rama «capturas» del repositorio.
    if: github.event_name == 'push' && github.ref != 'refs/heads/capturas'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar APK de depuración
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Emulador y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/capturas.sh capturas

      - name: Publicar capturas en la rama «capturas»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd capturas
          git init -q
          git checkout -q -b capturas
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Capturas de $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas
